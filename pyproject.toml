[project]
name = "kitchen-table"
version = "0.1.0"
description = "A private, local letter explainer for a parent: snap a photo of confusing mail, get a plain-language answer in their own language. Runs on Gemma 4 via Ollama; nothing leaves the house."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "pillow>=10",
  "qrcode>=7.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kitchen-table = "kitchen_table.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kitchen_table"]
